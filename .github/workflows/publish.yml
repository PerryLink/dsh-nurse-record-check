name: publish

on:
  push:
    tags: ['v*']

permissions:
  contents: write # GitHub Release
  id-token: write # npm provenance

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run build
      # "npm stage" only exists from npm 11.15.0, and the npm bundled with the
      # runner's Node 22 is older - without this the step dies with
      # 'Unknown command: "stage"'.
      - name: Upgrade npm so the stage command exists
        shell: bash
        run: |
          npm install -g npm@^11.15.0
          echo "npm: $(npm --version)"
      - name: Verify the tag matches the package version
        shell: bash
        run: |
          tag="v$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "${tag}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package version ${tag}"
            exit 1
          fi
      # This account's npm granular access tokens are stage-only. npm refuses a
      # direct publish with them ("this token can only publish to a staging
      # area") and refuses them outright for a package name that does not exist
      # yet, so neither "npm publish" nor "pnpm publish" can deliver here.
      #
      # "npm stage publish" is the path that works for both, and it is what
      # creates the package name the first time. A staged version is NOT
      # installable until a maintainer approves it with 2FA (npm web UI, or
      # "npm stage approve <stage-id>").
      #
      # Once the package exists and a trusted publisher is configured for this
      # repository, replace this step with "npm publish --provenance".
      - name: Stage the version on npm
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version="$(node -p "require('./package.json').version")"
          set +e
          out="$(npm stage publish --provenance --access public 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$out"
          if [ "$status" -ne 0 ]; then
            if printf '%s' "$out" | grep -qE 'E409|previously published|already staged'; then
              echo "dsh-nurse-record-check@${version} is already staged or published; treating this as done"
              exit 0
            fi
            exit "$status"
          fi
      # Advisory: say which of the two resting states the version is in, so the
      # run summary does not read as "published" when it is only queued.
      - name: Report the staged state (advisory)
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "dsh-nurse-record-check@${version}" version >/dev/null 2>&1; then
            echo "dsh-nurse-record-check@${version} is live on the registry"
            exit 0
          fi
          echo "::notice::dsh-nurse-record-check@${version} is staged and awaits maintainer approval with 2FA"
          npm stage list "dsh-nurse-record-check" || true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
